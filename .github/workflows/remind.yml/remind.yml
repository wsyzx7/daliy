name: study-reminder

on:
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning / noon / evening / night'
        required: false
        default: 'morning'

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: resolve slot
        id: slot
        shell: bash
        run: |
          case "${{ github.event.schedule }}" in
            "30 0 * * *") slot=morning ;;
            "0 5 * * *")  slot=noon ;;
            "0 11 * * *") slot=evening ;;
            "0 14 * * *") slot=night ;;
            *) slot="${{ github.event.inputs.slot }}" ;;
          esac
          if [ -z "$slot" ]; then slot=morning; fi
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
      - name: push to wechat
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          SLOT: ${{ steps.slot.outputs.slot }}
        run: node tools/remind.mjs
